{% extends "layout.html" %}

{% block title %}Etusivu &ndash; XFit{% endblock %}

{% block content %}
<h1>Etusivu</h1>
{% if authenticated %}
<br>
<h2>Moi {{ username }}</h2>
<br>
<h3>Muut käyttäjät</h3>
<ul>
{% for user in users %}
	<li>
	<a href="{{ url_for('profile', user_id = user['id']) }}">{{ user['username'] }}</a>	
	</li>
{% endfor %}
</ul>
{% endif %}
{% endblock %}
