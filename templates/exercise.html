{% extends "layout.html" %}

{% block title %}Harjoitukset &ndash; XFit{% endblock %}

{% block content %}
<div class="page-nav exercises-nav">
	<ul class="no-bullets">
		<li><a href="{{ url_for('get_exercises') }}">Harjoitukset</a></li>
		<li><a href="{{ url_for('get_exercise_templates') }}">Harjoituspohjat</a></li>
		<li><a href="{{ url_for('get_exercises_search') }}">Etsi harjoituspohjia</a></li>
    </ul>
</div>
<div class="page-container">
	<h2>Harjoitus</h2>
	<p>{{ exercise.date }}</p>
	<div class="form-container">
		<form action="{{ url_for('post_exercise', exercise_id = exercise.id) }}" method="POST">
			<input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">	
			<label for="name">Harjoituksen nimi:</label>
			<input 
				type="text" 
				id="name" 
				name="name"
				value="{{ exercise.name }}"
				maxlength="{{ form_input.max_name_length }}"
				required>
			
			<label for="name">Huomiot:</label>
			<input 
				type="text" 
				id="notes" 
				name="notes"
				value="{{ exercise.notes or "" }}"
				maxlength="{{ form_input.max_note_length }}">
			
			<button type="submit" class="btn btn-primary">Päivitä perustiedot</button>
		</form>
	</div>
	<br>
	<p>
		Mene <a href="{{ url_for('get_workout', workout_id = workout_id) }}">treeniin</a>
	</p>
</div>
{% endblock %}
